<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f2f2f7">
  <title>Task Map</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-screen" id="login-screen" hidden>
    <form class="login-card" id="login-form">
      <h1 class="login-title">Task Map</h1>
      <p class="login-subtitle">ログインしてタスクを同期</p>
      <label class="field">
        <span class="field-label">メール</span>
        <input type="email" id="login-email" class="field-input" required autocomplete="username">
      </label>
      <label class="field">
        <span class="field-label">パスワード</span>
        <input type="password" id="login-password" class="field-input" required autocomplete="current-password">
      </label>
      <p class="login-error" id="login-error" hidden></p>
      <button type="submit" class="btn-login" id="btn-login">ログイン</button>
    </form>
  </div>

  <div class="app" id="app" hidden>
    <header class="app-header">
      <h1 class="app-title">Task Map</h1>
      <div class="header-actions">
        <button type="button" class="btn-logout" id="btn-logout">ログアウト</button>
        <button type="button" class="btn-add" id="btn-add" aria-label="タスクを追加">＋</button>
      </div>
    </header>

    <main class="app-main">
      <section class="view view-map is-active" id="view-map" aria-label="マップ">
        <div class="map-container">
          <div class="map-y-label">Importance</div>
          <div class="map-area-wrap">
            <div class="map-area" id="map-area">
              <div class="map-axis map-axis-h"></div>
              <div class="map-axis map-axis-v"></div>
              <div class="map-notes" id="map-notes"></div>
            </div>
            <div class="map-x-label">Urgency</div>
          </div>
        </div>
      </section>

      <section class="view view-list" id="view-list" aria-label="リスト">
        <ul class="task-list" id="task-list"></ul>
        <p class="empty-message" id="list-empty" hidden>タスクはありません</p>
      </section>

      <section class="view view-archive" id="view-archive" aria-label="アーカイブ">
        <ul class="task-list" id="archive-list"></ul>
        <p class="empty-message" id="archive-empty" hidden>完了したタスクはありません</p>
      </section>
    </main>

    <nav class="tab-bar" role="tablist">
      <button type="button" class="tab is-active" data-tab="map" role="tab" aria-selected="true">
        <span class="tab-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/>
          </svg>
        </span>
        <span class="tab-label">Map</span>
      </button>
      <button type="button" class="tab" data-tab="list" role="tab" aria-selected="false">
        <span class="tab-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M8 6h13M8 12h13M8 18h13"/>
            <circle cx="4" cy="6" r="1.2" fill="currentColor" stroke="none"/>
            <circle cx="4" cy="12" r="1.2" fill="currentColor" stroke="none"/>
            <circle cx="4" cy="18" r="1.2" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        <span class="tab-label">List</span>
      </button>
      <button type="button" class="tab" data-tab="archive" role="tab" aria-selected="false">
        <span class="tab-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 7h18v3H3z"/>
            <path d="M5 10v9h14v-9"/>
            <path d="M10 14h4"/>
          </svg>
        </span>
        <span class="tab-label">Archive</span>
      </button>
    </nav>
  </div>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <button type="button" class="btn-text" id="btn-cancel">キャンセル</button>
        <h2 class="modal-title" id="modal-title">新規タスク</h2>
        <button type="button" class="btn-text btn-primary" id="btn-save">保存</button>
      </div>
      <form class="modal-body" id="task-form">
        <input type="hidden" id="task-id">
        <label class="field">
          <span class="field-label">タスク名</span>
          <input type="text" id="task-title" class="field-input" required maxlength="100" placeholder="やること" autocomplete="off">
        </label>
        <label class="field">
          <span class="field-label">締切</span>
          <input type="datetime-local" id="task-deadline" class="field-input" required>
        </label>
        <label class="field">
          <span class="field-label">予測時間（分）</span>
          <input type="number" id="task-minutes" class="field-input" required min="1" max="9999" value="60">
        </label>
        <label class="field">
          <span class="field-label">重要度 <span id="importance-value">50</span></span>
          <input type="range" id="task-importance" class="field-slider" min="0" max="100" value="50">
        </label>
        <label class="field">
          <span class="field-label">カテゴリ</span>
          <select id="task-category" class="field-input">
            <option value="research">研究</option>
            <option value="university">大学</option>
            <option value="private">プライベート</option>
            <option value="other">その他</option>
          </select>
        </label>
        <div class="modal-actions" id="modal-actions" hidden>
          <button type="button" class="btn-complete" id="btn-complete">完了</button>
          <button type="button" class="btn-delete" id="btn-delete">削除</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/urgency.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
